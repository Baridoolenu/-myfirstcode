<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Simple Web App</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>

    <h1>Simple web app #myfirst </h1> 
    <main class="card">
      <h1>Welcome to a platform made by efeeloodum wisdom to learn awesome and super user-friendly and interactive</h1>
      <p>Click the button to count and change the message.</p>

      <label for="name">Your name:</label>
      <input id="name" type="text" placeholder="Enter your name" />

      <button id="greetBtn">Say hello</button>
      <p id="message">Hello there!</p>
      <p>Button clicks: <span id="count">0</span></p>
    </main>

    <script src="script.js"></script>
  </body>
</html>
